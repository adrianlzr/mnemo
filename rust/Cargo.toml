[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
resolver = "3"
members = [
    "crates/*",
    "bin/*",
]
exclude = [
    "bin/go",
    "experiments",
    "bin/ignore"
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
socket2 = { version = "0.5", features = ["all"] }
dashmap = { version = "6.1.0", features = ["serde"] }
tokio = {version = "1", features = ["full"]}
ahash = "0.8.0"
